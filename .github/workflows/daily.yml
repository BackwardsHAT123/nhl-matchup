name: Daily update

on:
  schedule:
    - cron: "0 14 * * *"   # 10:00 ET: morning slate
    - cron: "30 21 * * *"  # 17:30 ET: refresh after starters are usually known
  workflow_dispatch:         # run manually after editing overrides.json

permissions:
  contents: write

concurrency:
  group: daily-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Current season
        id: season
        run: echo "cur=$(python seasons.py | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

      # Past-season shot files never change; cache them (keyed by season) so only the current one re-downloads.
      - uses: actions/cache@v4
        with:
          path: data/raw/shots_*
          key: shots-${{ steps.season.outputs.cur }}

      - name: Refresh data and rebuild features
        run: python update_data.py

      - name: Backtest
        run: python backtest.py

      - name: Export dashboard data
        run: python export_dashboard.py

      - name: Team and player stats (matchup drill-down)
        continue-on-error: true
        run: python team_stats.py

      - name: Same-game parlay candidates
        continue-on-error: true   # never block the main predictions
        env:
          # odds cost ~70 credits per run: fetched on manual runs, or on every run if repo variable ODDS_SCHEDULED=true
          ODDS_API_KEY: ${{ (github.event_name == 'workflow_dispatch' || vars.ODDS_SCHEDULED == 'true') && secrets.ODDS_API_KEY || '' }}
        run: python sgp_slate.py

      - name: Commit dashboard data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data
          git diff --cached --quiet && echo "No changes" && exit 0
          git commit -m "Update predictions $(date -u +%Y-%m-%dT%H:%MZ)"
          git pull --rebase
          git push
